
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F4F8F1">
<title>动作库 - MoveFit</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#F4F8F1;color:#263B30;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
.app{max-width:480px;margin:auto;padding:25px 18px 100px}
header{display:flex;align-items:center;justify-content:space-between}
.back{color:#64816A;text-decoration:none;font-size:14px}
.logo{font-size:20px;font-weight:800}
.logo span{color:#78A982}
h1{font-size:26px;margin:30px 0 8px}
.sub{font-size:13px;color:#8A9A8D;margin-bottom:22px}
.search{width:100%;padding:14px 16px;border:1px solid #E5ECE3;border-radius:14px;background:white;font-size:14px;outline:none}
.filters{display:flex;gap:9px;overflow-x:auto;margin:18px 0;padding-bottom:5px}
.filters button{white-space:nowrap;border:0;background:white;color:#718276;border-radius:20px;padding:9px 16px;font-size:13px}
.filters button.active{background:#527F5B;color:white}
.count{font-size:12px;color:#8A9A8D;margin:15px 0}
.list{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{background:white;border-radius:18px;padding:14px;min-width:0}
.picture{height:112px;background:#EDF4EA;border-radius:13px;display:grid;place-items:center;font-size:43px}
.item h3{font-size:15px;margin:12px 0 5px}
.item p{font-size:12px;color:#8A9A8D;margin:0}
.tag{display:inline-block;margin-top:10px;padding:4px 8px;background:#F1F6EF;color:#64816A;border-radius:8px;font-size:11px}
.empty{grid-column:1/-1;text-align:center;color:#8A9A8D;padding:40px 0}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;justify-content:space-around;padding:13px 5px calc(13px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);border-top:1px solid #E9EFE8}
nav a{text-decoration:none;color:#8A9A8D;text-align:center;font-size:11px}
nav a.active{color:#527F5B;font-weight:700}
nav span{display:block;font-size:21px;margin-bottom:4px}
</style>
</head>
<body>
<main class="app">
<header>
<a class="back" href="../index.html">← 返回首页</a>
<div class="logo">Move<span>Fit</span></div>
</header>

<h1>探索动作库</h1>
<div class="sub">找到适合自己的动作，慢慢练出好状态。</div>

<input class="search" id="search" placeholder="搜索动作名称……">

<div class="filters" id="filters">
<button class="active" data-type="全部">全部</button>
<button data-type="臀腿">臀腿</button>
<button data-type="核心">核心</button>
<button data-type="背部">背部</button>
<button data-type="胸肩">胸肩</button>
<button data-type="全身">全身</button>
</div>

<div class="count" id="count">动作列表</div>
<section class="list" id="list"></section>
</main>

<nav>
<a href="../index.html"><span>⌂</span>首页</a>
<a class="active" href="exercises.html"><span>▦</span>动作库</a>
<a href="training.html"><span>◎</span>训练</a>
<a href="profile.html"><span>♙</span>我的</a>
</nav>

<script>
const exercises = [
 {name:"深蹲",type:"臀腿",emoji:"🏋️",level:"初级"},
 {name:"臀桥",type:"臀腿",emoji:"🌿",level:"初级"},
 {name:"反向弓步蹲",type:"臀腿",emoji:"🦵",level:"初级"},
 {name:"靠墙静蹲",type:"臀腿",emoji:"🧘",level:"初级"},
 {name:"站姿提踵",type:"臀腿",emoji:"🦶",level:"初级"},
 {name:"死虫式",type:"核心",emoji:"🐞",level:"初级"},
 {name:"平板支撑",type:"核心",emoji:"💪",level:"初级"},
 {name:"鸟狗式",type:"核心",emoji:"🐦",level:"初级"},
 {name:"仰卧卷腹",type:"核心",emoji:"🌱",level:"初级"},
 {name:"俯身划船",type:"背部",emoji:"🏋️",level:"初级"},
 {name:"超人式",type:"背部",emoji:"🦸",level:"初级"},
 {name:"跪姿俯卧撑",type:"胸肩",emoji:"💪",level:"初级"},
 {name:"墙壁俯卧撑",type:"胸肩",emoji:"🧱",level:"初级"},
 {name:"站姿肩推",type:"胸肩",emoji:"🙌",level:"初级"},
 {name:"原地踏步",type:"全身",emoji:"🚶",level:"初级"},
 {name:"开合步",type:"全身",emoji:"⭐",level:"初级"}
];

let currentType="全部";

function render(){
 const keyword=document.getElementById("search").value.trim().toLowerCase();
 const result=exercises.filter(item=>
  (currentType==="全部"||item.type===currentType)&&
  item.name.toLowerCase().includes(keyword)
 );
 document.getElementById("count").textContent=`共找到 ${result.length} 个动作`;
 document.getElementById("list").innerHTML=result.length
 ?result.map(item=>`
  <article class="item">
   <div class="picture">${item.emoji}</div>
   <h3>${item.name}</h3>
   <p>${item.level} · ${item.type}</p>
   <span class="tag">动作演示待完善</span>
  </article>`).join("")
 :'<div class="empty">没有找到相关动作，换个关键词试试吧。</div>';
}

document.getElementById("search").addEventListener("input",render);
document.getElementById("filters").addEventListener("click",e=>{
 if(e.target.tagName!=="BUTTON")return;
 document.querySelectorAll(".filters button").forEach(b=>b.classList.remove("active"));
 e.target.classList.add("active");
 currentType=e.target.dataset.type;
 render();
});
render();
</script>
</body>
</html>
