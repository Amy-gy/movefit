
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F4F8F1">
  <title>动起来 MoveFit</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #F4F8F1;
      color: #263B30;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    }
    .app {
      max-width: 480px;
      min-height: 100vh;
      margin: auto;
      padding: 28px 20px 100px;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo { font-size: 23px; font-weight: 800; }
    .logo span { color: #78A982; }
    .date { color: #849488; font-size: 13px; }
    .hello { margin-top: 32px; }
    .hello h1 { font-size: 27px; margin: 0 0 8px; }
    .hello p { color: #849488; font-size: 14px; }
    .hero {
      margin-top: 25px;
      padding: 25px 22px;
      border-radius: 24px;
      background: #DDEBDD;
    }
    .hero-label { font-size: 13px; color: #55775C; }
    .progress {
      display: flex;
      align-items: center;
      gap: 20px;
      margin: 20px 0;
    }
    .circle {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      border: 7px solid #A8C9A9;
      display: grid;
      place-items: center;
      font-size: 25px;
      font-weight: 800;
      background: #EDF5EA;
    }
    .circle small { font-size: 11px; font-weight: 400; }
    .progress-info strong { font-size: 18px; }
    .progress-info p { font-size: 12px; color: #64816A; }
    .start {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 15px;
      background: #527F5B;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .section-title {
      margin: 30px 0 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 18px;
      font-weight: 750;
    }
    .section-title small { color: #8A9A8D; font-size: 12px; font-weight: 400; }
    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .card {
      background: white;
      border-radius: 18px;
      padding: 17px;
      min-height: 112px;
    }
    .card .emoji { font-size: 25px; }
    .card strong { display: block; margin-top: 12px; font-size: 15px; }
    .card p { margin: 5px 0 0; font-size: 12px; color: #91A094; }
    .tip {
      margin-top: 22px;
      padding: 18px;
      background: #FFF8E9;
      border-radius: 18px;
      color: #876F45;
      font-size: 13px;
      line-height: 1.7;
    }
    nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-around;
      padding: 13px 5px calc(13px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,.96);
      border-top: 1px solid #E9EFE8;
    }
    nav a {
      text-decoration: none;
      color: #8A9A8D;
      text-align: center;
      font-size: 11px;
    }
    nav a.active { color: #527F5B; font-weight: 700; }
    nav span { display: block; font-size: 21px; margin-bottom: 4px; }
  </style>
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="logo">Move<span>Fit</span></div>
      <div class="date" id="today"></div>
    </header>

    <section class="hello">
      <h1>今天也要动起来 🌿</h1>
      <p>不必追求完美，每一次坚持都值得记录。</p>
    </section>

    <section class="hero">
      <div class="hero-label">今日训练目标</div>
      <div class="progress">
        <div class="circle">
          <div><span id="done">0</span><small> / 5</small></div>
        </div>
        <div class="progress-info">
          <strong>完成今天的训练</strong>
          <p>选择 5 个动作，开启今天的运动时间</p>
        </div>
      </div>
      <button class="start" onclick="startTraining()">开始今日训练 →</button>
    </section>

    <div class="section-title">
      训练入口 <small>选择你想做的事</small>
    </div>

    <section class="cards">
      <div class="card">
        <div class="emoji">🏋️</div>
        <strong>动作库</strong>
        <p>探索不同训练动作</p>
      </div>
      <div class="card">
        <div class="emoji">📅</div>
        <strong>训练记录</strong>
        <p>回顾每一次进步</p>
      </div>
      <div class="card">
        <div class="emoji">⭐</div>
        <strong>我的收藏</strong>
        <p>保存喜欢的动作</p>
      </div>
      <div class="card">
        <div class="emoji">🎖️</div>
        <strong>我的贴纸</strong>
        <p>收集运动小奖励</p>
      </div>
    </section>

    <div class="tip">
      🌱 今日小提醒<br>
      运动不需要一次做到很多。从一个简单的动作开始，也是一种进步。
    </div>
  </main>

  <nav>
    <a class="active" href="index.html"><span>⌂</span>首页</a>
    <a href="pages/exercises.html"><span>▦</span>动作库</a>
    <a href="pages/training.html"><span>◎</span>训练</a>
    <a href="pages/profile.html"><span>♙</span>我的</a>
  </nav>

  <script>
    const now = new Date();
    document.getElementById('today').textContent =
      `${now.getMonth()+1}月${now.getDate()}日`;

    function startTraining() {
      location.href = 'pages/training.html';
    }
  </script>
</body>
</html>
